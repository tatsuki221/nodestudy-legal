<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Node — メール確認</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.8; color: #1f2b30; background: #f7f8f8;
    margin: 0; padding: 48px 16px; text-align: center;
  }
  main { max-width: 480px; margin: 0 auto; background: #fff;
    border-radius: 16px; padding: 32px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { color: #5b6b70; }
  .mark { font-size: 2.4rem; color: #86a79c; margin-bottom: 8px; }
  a.mail { color: #3b7a65; }
  #error { display: none; }
</style>
</head>
<body>
<main>
  <div id="ok">
    <div class="mark">✓</div>
    <h1>メールアドレスの確認が完了しました</h1>
    <p>Node アプリに戻り、登録したメールアドレスとパスワードでログインしてください。</p>
  </div>
  <div id="error">
    <h1>リンクが無効です</h1>
    <p>確認リンクの有効期限が切れているか、すでに使用済みです。<br>
      すでに確認済みの場合は、そのまま Node アプリでログインできます。<br>
      ログインできない場合は、アプリから再度登録をお試しください。</p>
  </div>
  <p style="margin-top:24px">お問い合わせ：<a class="mail" href="mailto:nodestudy@proton.me">nodestudy@proton.me</a></p>
</main>
<script>
  // Supabase はエラー時に #error=...（または ?error=...）を付けて戻す
  if (/(^|[#&?])error=/.test(location.hash + location.search)) {
    document.getElementById('ok').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
</script>
</body>
</html>
